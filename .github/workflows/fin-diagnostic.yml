name: Financial history diagnostic
on:
  push:
    paths:
      - .github/workflows/fin-diagnostic.yml
  workflow_dispatch:
concurrency:
  group: news-loader
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements_news.txt
      - run: python repair_fin_history.py
        env:
          ORDS_BASE: ${{ secrets.ORDS_BASE }}
          ORDS_CLIENT_ID: ${{ secrets.ORDS_CLIENT_ID }}
          ORDS_CLIENT_SECRET: ${{ secrets.ORDS_CLIENT_SECRET }}
