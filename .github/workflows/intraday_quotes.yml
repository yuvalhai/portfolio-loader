name: Intraday quotes (holdings)

on:
  workflow_dispatch:
  push:
    paths:
      - "load_quotes.py"
      - ".github/workflows/intraday_quotes.yml"

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load quotes
        env:
          ORDS_BASE: ${{ secrets.ORDS_BASE }}
          ORDS_CLIENT_ID: ${{ secrets.ORDS_CLIENT_ID }}
          ORDS_CLIENT_SECRET: ${{ secrets.ORDS_CLIENT_SECRET }}
        run: python load_quotes.py
