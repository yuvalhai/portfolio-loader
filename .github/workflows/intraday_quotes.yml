name: Intraday quotes (holdings)

on:
  schedule:
    # Every 15 minutes, 13:00-21:45 UTC, Monday to Friday (covers US market hours in summer and winter)
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

jobs:
  quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load quotes
        env:
          ORDS_BASE: ${{ secrets.ORDS_BASE }}
          ORDS_CLIENT_ID: ${{ secrets.ORDS_CLIENT_ID }}
          ORDS_CLIENT_SECRET: ${{ secrets.ORDS_CLIENT_SECRET }}
        run: python load_quotes.py
